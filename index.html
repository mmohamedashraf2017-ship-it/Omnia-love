<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>From Mahmoud To Omnia ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    radial-gradient(circle at top,#fff4f6 0%,#e8a7b8 28%,#9d526b 65%,#3d1725 100%);
}

/* ================= الخلفية ================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.heart{
  position:absolute;
  bottom:-70px;
  font-size:28px;
  opacity:0;
  animation:floatHeart 12s linear infinite;
}

.heart:nth-child(1){
  left:7%;
  animation-duration:10s;
}

.heart:nth-child(2){
  left:23%;
  animation-duration:13s;
  animation-delay:3s;
}

.heart:nth-child(3){
  left:42%;
  animation-duration:11s;
  animation-delay:5s;
}

.heart:nth-child(4){
  left:62%;
  animation-duration:14s;
  animation-delay:2s;
}

.heart:nth-child(5){
  left:80%;
  animation-duration:10s;
  animation-delay:6s;
}

.heart:nth-child(6){
  left:94%;
  animation-duration:13s;
  animation-delay:1s;
}

@keyframes floatHeart{

  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }

  15%{
    opacity:.65;
  }

  100%{
    transform:translateY(-115vh) rotate(360deg);
    opacity:0;
  }

}

/* ================= الحاوية ================= */

.container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:500px;
  margin:auto;
  padding:18px;
}

/* ================= الدخول ================= */

.login{
  min-height:95vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  padding:32px 22px;
  text-align:center;

  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.4);
  border-radius:34px;

  backdrop-filter:blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.3);
}

.big-heart{
  font-size:75px;
  margin-bottom:15px;
  animation:pulse 1.7s infinite;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

}

.login h1{
  font-size:34px;
  line-height:1.5;
  margin-bottom:22px;
}

.names{
  margin-bottom:22px;
}

.names .label{
  display:block;
  font-size:14px;
  letter-spacing:4px;
  opacity:.75;
  margin-bottom:4px;
}

.names .name{
  display:block;
  font-size:31px;
  margin-bottom:10px;
}

.arrow{
  font-size:26px;
  margin:3px 0;
}

.date{
  font-size:21px;
  letter-spacing:2px;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:18px;
  border:none;
  outline:none;
  border-radius:18px;

  text-align:center;

  font-family:inherit;
  font-size:22px;

  margin-bottom:14px;
}

.open{
  width:100%;
  padding:18px;

  border:none;
  border-radius:18px;

  background:#fff;
  color:#9d526b;

  font-family:inherit;
  font-size:20px;
  font-weight:bold;

  cursor:pointer;

  transition:.3s;
}

.open:active{
